<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produção — Industrial BI Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body data-page="producao" data-title="Produção">
  <div class="app">
    <aside id="sidebar"></aside>
    <main class="main">
      <header id="topbar"></header>
      <div class="content">
<div class="filters"><label>Período<select id="f-periodo"><option value="7">Últimos 7 dias</option><option value="30" selected>Últimos 30 dias</option><option value="90">Últimos 90 dias</option></select></label> <label>Setor<select id="f-setor"></select></label><label>Linha<select id="f-linha"></select></label><label>Turno<select id="f-turno"></select></label><label>Produto<select id="f-produto"></select></label><button class="btn-ghost" id="f-reset">Limpar filtros</button></div>
<div class="grid kpis" id="kpis"></div>
<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Histórico diário</h3><span>produzido x meta</span></div><div class="chart-box"><canvas id="c-hist"></canvas></div></div>
<div class="grid g-3">
  <div class="card"><div class="card-head"><h3>Produção por linha</h3><span>peças</span></div><div class="chart-box"><canvas id="c-linha"></canvas></div></div>
  <div class="card"><div class="card-head"><h3>Produção por turno</h3><span>peças e eficiência</span></div><div class="chart-box"><canvas id="c-turno"></canvas></div></div>
  <div class="card"><div class="card-head"><h3>Produção por produto</h3><span>peças</span></div><div class="chart-box"><canvas id="c-produto"></canvas></div></div>
</div>
<div class="card"><div class="card-head"><h3>Tabela diária</h3><span id="t-count"></span></div><div class="table-wrap"><table><thead><tr><th>Data</th><th class="num">Meta</th><th class="num">Produzido</th><th class="num">Eficiência</th><th class="num">Rejeitado</th><th class="num">Custo</th></tr></thead><tbody id="t-body"></tbody></table></div></div>
      </div>
    </main>
  </div>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/producao.js"></script>
</body>
</html>
